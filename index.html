      ${M.contact.send.map(a =>
        `<strong style="font-weight:500;color:var(--ink)">${esc(a)}</strong>`).join(" or ")}
      and we'll come back with an official quote.</p>
    <div class="btnrow printhide">
      <button class="btn oak" data-print="1">Save as PDF</button>
      <button class="btn ghost" data-copysheet="1">Copy as text</button>
    </div>`;

  el.innerHTML = h;
}

/* ============================================================================
   6. TEXT OUTPUT + ENQUIRY
   ========================================================================== */

function sheetText(){
  const t = basketTotals();
  const L = [];
  L.push(`LEON ${(t.productNames.join(" + ") || LEON.family.name).toUpperCase()} — CONFIGURATION & PRICE LIST`);
  L.push(`${state.dealer || "CAVD"} · ${new Date().toLocaleDateString("en-GB")}`);
  L.push("");
  /* Same placement as the sheet — above the prices, not buried under them. */
  L.push(`** ${M.shippingLoud.toUpperCase()} ${M.shippingNote} **`);
  L.push("");
  state.basket.forEach((item, i) => {
    L.push(`${i+1}. ${item.price.sku}  ×${item.qty}`);
    L.push(`   ${describe(item.cfg)}`);
    item.price.lines.forEach(l =>
      L.push(`   · ${l.label} — ${lineMoney(l.dealer)}${l.dealer && item.qty > 1 ? " ea" : ""}`));
    L.push(`   ${money(item.price.dealer * item.qty)} dealer, ex VAT`);
    L.push("");
  });
  L.push(`DEALER TOTAL, EX VAT: ${money(t.dealer)}`);
  L.push(`${M.shippingLoud.toUpperCase()} ${M.shippingNote}`);
  if (t.bracketAllowance && (t.bracketAllowance.amount || t.bracketAllowance.unknown)){
    const a = t.bracketAllowance;
    L.push(`${M.bracketAllowanceNote} ${a.amount
      ? `Allow a further ${money(a.amount)} if so.`
      : "Where the bracket is in the box, we'd confirm the cost of a second with Leon before order."}`);
  }
  L.push("");
  L.push(M.quoteNote);
  L.push(M.shippingNote + " These are not delivered prices.");
  L.push(M.leadTimeNote);
  L.push("");
  L.push(M.sendNote);
  return L.join("\n");
}

function enquiryText(routeId){
  const c = state.cfg;
  const P = curP();
  const L = [];
  /* Named from the config where there is one, otherwise from the basket. The
     old fallback was LEON.family.name, which read "Leon Leon enquiry" once the
     line had been added and state.cfg was blank again — which is exactly when
     the system-discount button is pressed. */
  const who = P ? P.name : basketTotals().productNames.join(" + ");
  L.push(`Leon${who ? " " + who : ""} enquiry${state.dealer ? " — " + state.dealer : ""}`);
  L.push("");
  if (routeId && LEON.routes[routeId]) L.push(`Reason: ${LEON.routes[routeId].title}`);
  if (routeId === "system") L.push("Reason: pricing a full Leon system (5.1 minimum, 5% system discount).");
  L.push("");
  L.push("Config so far:");
  const cfgAt = L.length;
  if (P) L.push(`· Product: ${P.name}`);
  if (c.soundbar) L.push(`· Soundbar: ${(barById(c, c.soundbar)||{}).shortLabel || (barById(c, c.soundbar)||{}).label}`);
  if (c.channels) L.push(`· Channels: ${(channelById(c, c.channels)||{}).label}`);
  if (tvBrandName(c)) L.push(`· TV brand: ${tvBrandName(c)}`);
  if ((c.tvModel||"").trim()) L.push(`· TV model: ${c.tvModel.trim()}`);
  { const T = (P||{}).tv;
    if (T && T.bezelLabel)
      L.push(`· ${T.bezelLabel}: ${(c.tvBezel||"").trim() || "to confirm"}`); }
  if (c.diagonal != null) L.push(`· Screen: ${c.diagonal}″`);
  if (c.model){ const bl = baseLine(c, bandFor(c));
                L.push(`· Cabinet: ${bl ? bl.sku : (modelById(c, c.model)||{}).name}`); }
  if (c.bracket && P && P.brackets){
    const br  = bracketLine(c);
    const pos = P.brackets.positions.find(x => x.id === c.bracket);
    L.push(`· Mounting: ${c.bracket === "none" ? (P.brackets.none||{}).label
          : br ? `${pos.label} — ${br.sku}${br.qty > 1 ? ` × ${br.qty}` : ""}`
               : `${(pos||{}).label} — bracket to confirm`}`);
  }
  if (c.finish){ const f = finishById(c, c.finish); if (f) L.push(`· Finish: ${f.name || f.label}`); }
  if (c.grille.type) L.push(`· Grille: ${c.grille.type === "designer"
      ? "Designer — " + ((colourById(c, c.grille.colour)||{}).name || "colour TBC") : "Standard Black"}`);
  if (c.wantPaint) L.push("· Paint: custom colour (to specify)");
  /* Nothing in progress: drop the heading and its blank line rather than
     print "(nothing configured yet)" directly above a list of configured
     lines. That's the normal state for the system-discount enquiry, where the
     basket is the whole story. */
  if (L.length === cfgAt) L.splice(cfgAt - 2, 2);
  if (state.basket.length){
    L.push("");
    L.push("Already configured:");
    state.basket.forEach((item,i) => L.push(`${i+1}. ${item.price.sku} ×${item.qty} — ${describe(item.cfg)}`));
    L.push(`Dealer total, ex VAT: ${money(basketTotals().dealer)}`);
  }
  L.push("");
  L.push("Notes:");
  L.push("");
  return L.join("\n");
}

/* UNREACHABLE as of 29 July 2026 — nothing renders a `data-enquire` button any
   more. Every route panel now shows the addresses as text with a "Copy the
   details" button, because a mailto: does nothing at all for a dealer whose
   machine has no mail handler, and fails without saying so.

   Kept, with its delegated handler, only as the reference implementation if a
   draft-opening button is ever wanted back. Don't wire anything to it without
   solving the silent-failure problem first. */
function openEnquiry(routeId){
  const body = routeId === "order" ? sheetText() : enquiryText(routeId);
  const P = curP();
  const label = routeId === "order"
    ? (basketTotals().productNames.join(" + ") || LEON.family.name)
    : (P ? P.name : LEON.family.name);
  const subject = routeId === "order"
    ? `Leon ${label} configuration${state.dealer ? " — " + state.dealer : ""}`
    : `Leon ${label} enquiry${state.dealer ? " — " + state.dealer : ""}`;
  const to = M.contact.primary;
  window.location.href = `mailto:${encodeURIComponent(to)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
  toast("Opening your email — nothing is sent until you send it.");
}

function copy(text, msg){
  const done = () => toast(msg || "Copied.");
  if (navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
  } else fallbackCopy(text, done);
}
function fallbackCopy(text, done){
  const ta = document.createElement("textarea");
  ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); done(); } catch(e){ toast("Couldn't copy — select the text instead."); }
  document.body.removeChild(ta);
}

let toastTimer;
function toast(msg){
  const el = $("#toast");
  el.textContent = msg; el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 3200);
}

/* ============================================================================
   7. EVENTS
   ========================================================================== */

function wireSteps(){
  const root = $("#steps");

  root.querySelectorAll("[data-open]").forEach(b =>
    b.onclick = () => { state.openStep = b.dataset.open; render(); scrollToStep(b.dataset.open); });

  root.querySelectorAll("[data-pick]").forEach(b => b.onclick = () => {
    const k = b.dataset.pick, v = b.dataset.val;
    if (k === "product"){
      /* Changing product invalidates every answer below it — the options,
         the bands and the steps themselves are all different. */
      if (state.cfg.product !== v){
        const keep = { qty:state.cfg.qty };
        state.cfg = Object.assign(blankCfg(), keep, { product:v });
        /* A product that fits one brand of set answers the brand itself, so
           the state carries it from the moment the product is chosen. Null
           for every other product, which is what blankCfg already had. */
        state.cfg.tvBrand = fixedBrand(prodOf(state.cfg));
      }
    } else if (k === "core"){
      state.cfg.core = v;
    } else if (k === "soundbar"){
      state.cfg.soundbar = v;
    } else if (k === "channels"){
      state.cfg.channels = v;
    } else if (k === "model"){
      state.cfg.model = v;
    } else if (k === "bracket"){
      state.cfg.bracket = v;
    } else if (k === "grille"){
      state.cfg.grille.type = v;
      if (v === "standard") state.cfg.grille.colour = null;
    }
    // picking on a reopened step closes it and returns to the flow
    state.openStep = (k === "grille" && v === "designer") ? "grille" : null;
    render();
  });

  root.querySelectorAll("[data-paint]").forEach(b => b.onclick = () => {
    state.cfg.wantPaint = !state.cfg.wantPaint;
    render();
  });

  root.querySelectorAll("[data-finish]").forEach(b => b.onclick = () => {
    state.cfg.finish = b.dataset.finish;
    state.openStep = null;
    render();
  });

  root.querySelectorAll("[data-brand]").forEach(b => b.onclick = () => {
    state.cfg.tvBrand = b.dataset.brand;
    if (state.cfg.tvBrand !== "__other") state.cfg.tvBrandOther = "";
    state.openStep = "size";                     // brand alone never completes the step
    render();
    const f = $(state.cfg.tvBrand === "__other" ? "#tvbrand" : "#tvmodel");
    if (f && !f.value) f.focus();
  });

  /* text inputs update state live but never trigger a re-render mid-typing */
  const wireText = (id, key) => {
    const el = root.querySelector(id);
    if (!el) return;
    el.oninput = () => { state.cfg[key] = el.value; refreshSizeStep(); };
    el.onkeydown = e => {
      if (e.key === "Enter"){
        e.preventDefault();
        const next = $("#sizeNext");
        if (next && !next.disabled){ state.openStep = null; render(); }
      }
    };
  };
  wireText("#tvbrand", "tvBrandOther");
  wireText("#tvmodel", "tvModel");
  wireText("#tvbezel", "tvBezel");

  const diag = root.querySelector("#diag");
  if (diag){
    diag.oninput = () => {
      const n = parseInt(diag.value, 10);
      const min = (curP() || {}).diagonal ? curP().diagonal.min : 24;
      state.cfg.diagonal = Number.isFinite(n) && n >= min ? n : null;
      // a hard block changes the step's structure — that one needs a re-render
      if (blockFor(state.cfg) || routedStepIndex() >= 0){ state.openStep = "size"; render(); return; }
      refreshSizeStep();
    };
    diag.onkeydown = e => {
      if (e.key === "Enter"){
        e.preventDefault();
        const next = $("#sizeNext");
        if (next && !next.disabled){ state.openStep = null; render(); }
      }
    };
  }

  root.querySelectorAll("[data-size]").forEach(b => b.onclick = () => {
    state.cfg.diagonal = parseInt(b.dataset.size, 10);
    state.openStep = "size";                     // stay put — brand and model still needed
    render();
  });

  root.querySelectorAll("[data-switch]").forEach(b => b.onclick = () => {
    state.cfg.soundbar = b.dataset.switch;
    state.openStep = null;
    render();
    toast("Switched to " + (barById(state.cfg, state.cfg.soundbar)||{}).label + ".");
  });

  root.querySelectorAll("[data-clearsize]").forEach(b => b.onclick = () => {
    state.cfg.diagonal = null; state.openStep = "size"; render();
    const d = $("#diag"); if (d) d.focus();
  });

  root.querySelectorAll("[data-next]").forEach(b => b.onclick = () => {
    state.openStep = null; render();
  });

  root.querySelectorAll("[data-colour]").forEach(b => b.onclick = () => {
    state.cfg.grille.colour = b.dataset.colour;
    state.openStep = null;
    render();
  });

  root.querySelectorAll("[data-addon]").forEach(b => b.onclick = () => {
    const id = b.dataset.addon;
    const i = state.cfg.addOns.indexOf(id);
    if (i === -1) state.cfg.addOns.push(id); else state.cfg.addOns.splice(i,1);
    render();
  });

  root.querySelectorAll("[data-add]").forEach(b => b.onclick = addToBasket);
  root.querySelectorAll("[data-canceledit]").forEach(b => b.onclick = () => {
    state.editIndex = null; state.cfg = blankCfg(); state.openStep = null; render(); scrollToTop();
  });
  root.querySelectorAll("[data-restart]").forEach(b => b.onclick = () => {
    state.cfg = blankCfg(); state.openStep = null; state.editIndex = null; render(); scrollToTop();
  });
}

function addToBasket(){
  const p = priceConfig(state.cfg);
  if (!p) return;
  const entry = { cfg:JSON.parse(JSON.stringify(state.cfg)), price:p, qty:state.cfg.qty || 1 };
  if (state.editIndex !== null){
    entry.qty = state.basket[state.editIndex].qty;
    state.basket[state.editIndex] = entry;
    state.editIndex = null;
    toast("Line updated.");
  } else {
    state.basket.push(entry);
    toast("Added. Configure another, or take the paperwork below.");
  }
  state.cfg = blankCfg();
  state.openStep = null;
  render();
  document.getElementById("basket").scrollIntoView({ behavior:"smooth", block:"start" });
}

/* delegated: basket + output controls */
document.addEventListener("click", e => {
  const el = e.target.closest("[data-qty],[data-edit],[data-remove],[data-newitem],[data-clearbasket],[data-showoutput],[data-copysheet],[data-print],[data-enquire],[data-copyenq]");
  if (!el) return;
  const d = el.dataset;

  if (d.qty !== undefined){
    const i = +d.qty;
    state.basket[i].qty = Math.max(1, state.basket[i].qty + (+d.delta));
    render(); return;
  }
  if (d.edit !== undefined){
    const i = +d.edit;
    state.cfg = JSON.parse(JSON.stringify(state.basket[i].cfg));
    state.editIndex = i; state.openStep = "extras";
    render(); scrollToTop(); return;
  }
  if (d.remove !== undefined){
    state.basket.splice(+d.remove, 1);
    if (!state.basket.length) state.showOutput = false;
    render(); return;
  }
  if (d.newitem){ state.cfg = blankCfg(); state.editIndex = null; state.openStep = null; render(); scrollToTop(); return; }
  if (d.clearbasket){
    if (!confirm("Clear every line on this list?")) return;
    state.basket = []; state.showOutput = false; render(); return;
  }
  if (d.showoutput){
    state.showOutput = !state.showOutput; render();
    if (state.showOutput) setTimeout(() => document.getElementById("output")
      .scrollIntoView({ behavior:"smooth", block:"start" }), 40);
    return;
  }
  if (d.copysheet){ copy(sheetText(), "Copied — paste it wherever you need it."); return; }
  if (d.print){ window.print(); return; }
  if (d.enquire !== undefined){ openEnquiry(d.enquire); return; }
  if (d.copyenq !== undefined){ copy(enquiryText(d.copyenq), "Details copied. Send them over however suits."); return; }
});

function scrollToTop(){ window.scrollTo({ top:0, behavior:"smooth" }); }
function scrollToStep(id){
  const el = document.querySelector(`[data-step="${id}"]`);
  if (el) el.scrollIntoView({ behavior:"smooth", block:"center" });
}

/* mobile rail expand */
$("#railToggle").onclick = () => {
  const r = $("#rail");
  const open = r.classList.toggle("is-open");
  $("#railToggle").setAttribute("aria-expanded", String(open));
  $("#railToggle").textContent = open ? "Close" : "Detail";
};

/* ============================================================================
   8. BOOT — per-dealer link: ?dealer=Name
   ========================================================================== */

(function init(){
  const q = new URLSearchParams(location.search);
  const dealer = (q.get("dealer") || q.get("d") || "").trim().slice(0, 60);
  /* One copy of the logo lives in LEON_LOGO; the masthead takes it from there */
  $("#mastLeonLogo").src = LEON_LOGO;

  /* The dealer name no longer appears in the masthead — it still heads the
     price list, which is the document that actually goes anywhere. */
  if (dealer) state.dealer = dealer;
  /* Spans, not mailto: anchors — see the note on .addrs. A dealer on webmail
     gets nothing from a mail-handler link; an address they can read and copy
     always works. */
  $("#footNote").innerHTML =
    `<span class="eyebrow">Contact us</span><br>` +
    M.contact.all.map(a => `<span class="addr">${a}</span>`).join("<br>");
  document.title = `Leon — Pricing Tool${dealer ? " — " + dealer : ""}`;
  render();
})();
