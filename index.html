<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Leon Tc Fit — Specification &amp; Pricing</title>
<style>
/* ============================================================
   Leon Tc Fit configurator — CAVD
   Design: architectural, bespoke, contemporary.
   Near-black, warm off-white, oak accent. No bright colour.
   ============================================================ */

:root{
  --ink:#1A1A1A;
  --ink-80:#3A3835;
  --paper:#FAF9F7;
  --paper-2:#F3F1EC;
  --card:#FFFFFF;
  --muted:#6E6A65;
  --muted-2:#94908A;
  --line:#E4E0D9;
  --line-2:#D6D1C7;
  --oak:#96754A;
  --oak-ink:#6E5533;
  --oak-wash:#F4EFE7;
  --warn:#8A5A34;
  --cavd-blue:#085086;   /* CAVD brand blue, from the official logo artwork */
  --step:clamp(1.6rem, 1.1rem + 1.6vw, 2.5rem);
  --gap:clamp(20px, 1.2rem + 2vw, 40px);
  --radius:2px;
  --font:"Inter","Inter var",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif;
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:var(--font);
  font-size:16px;
  line-height:1.55;
  font-weight:400;
  letter-spacing:-0.005em;
  -webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom);
}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}
input{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;font-weight:300;letter-spacing:-0.025em;line-height:1.12}
p{margin:0}

/* ---------- shared type ---------- */
.eyebrow{
  font-size:10.5px;font-weight:500;text-transform:uppercase;
  letter-spacing:.19em;color:var(--muted-2);
}
.note{font-size:13.5px;line-height:1.6;color:var(--muted)}
.tabular{font-variant-numeric:tabular-nums}

/* ---------- masthead ---------- */
.masthead{
  border-bottom:1px solid var(--line);
  background:var(--paper);
  position:relative;z-index:5;
}
.masthead-in{
  max-width:1200px;margin:0 auto;padding:22px var(--gap) 20px;
  display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap;
}
.masthead-in{align-items:center}
.brand{display:flex;align-items:center;gap:16px}
.brand .product{font-size:19px;font-weight:300;letter-spacing:.02em;color:var(--muted)}

/* ---------- logos ----------
   Leon is the official RGB asset, embedded so the file stays self-contained.
   CAVD is inline vector in its brand blue. Both are sized by height, and both
   viewboxes are tight to the artwork, so equal heights read as equal weight. */
.logo-leon{height:26px;width:auto;display:block}
.logo-cavd{height:26px;width:auto;display:block}
.logo-cavd path{fill:var(--cavd-blue)}
.distby{display:flex;flex-direction:column;align-items:flex-end;gap:9px}
@media (max-width:560px){
  .masthead-in{gap:16px}
  .logo-leon{height:21px}
  .logo-cavd{height:21px}
  .brand{gap:12px}
  .brand .product{font-size:15px}
  .distby{gap:7px}
}

/* Co-branding on the sheet itself — this is the part that prints */
.sheet-marks{
  display:flex;align-items:center;gap:16px;
  padding-bottom:18px;margin-bottom:20px;border-bottom:1px solid var(--line);
}
.sheet-marks .logo-leon{height:24px}
.sheet-marks .logo-cavd{height:24px}
.sheet-marks .sep{width:1px;height:22px;background:var(--line-2)}
.sheet-marks .by{font-size:10.5px;font-weight:500;text-transform:uppercase;
  letter-spacing:.19em;color:var(--muted-2);margin-right:-6px}

/* ---------- hero ---------- */
.hero{
  max-width:1200px;margin:0 auto;
  padding:clamp(40px,4vw,72px) var(--gap) clamp(28px,2.5vw,44px);
}
.hero h1{
  font-size:clamp(2rem,1.3rem + 2.6vw,3.4rem);
  max-width:16ch;
}
.hero p{margin-top:18px;max-width:52ch;font-size:17px;color:var(--muted);line-height:1.62}

/* ---------- layout ---------- */
.layout{
  max-width:1200px;margin:0 auto;padding:0 var(--gap) 120px;
  display:grid;grid-template-columns:minmax(0,1fr) 320px;
  gap:clamp(32px,4vw,72px);align-items:start;
}
@media (max-width:900px){
  .layout{grid-template-columns:minmax(0,1fr);padding-bottom:160px}
}

/* ---------- steps ---------- */
.step{border-top:1px solid var(--line);padding:0}
.step:last-of-type{border-bottom:1px solid var(--line)}

.step-head{
  width:100%;display:flex;align-items:baseline;gap:16px;
  padding:22px 0;text-align:left;
}
.step-num{
  font-size:10.5px;letter-spacing:.19em;font-weight:500;color:var(--muted-2);
  min-width:22px;padding-top:3px;
}
.step-title{font-size:20px;font-weight:300;letter-spacing:-0.02em;flex:1}
.step.is-open .step-title{font-size:clamp(1.35rem,1.1rem + .9vw,1.85rem)}
.step-answer{
  font-size:15px;color:var(--oak-ink);text-align:right;
  max-width:52%;letter-spacing:-0.01em;
}
.step-edit{
  font-size:10.5px;letter-spacing:.19em;text-transform:uppercase;color:var(--muted-2);
  border-bottom:1px solid transparent;padding-bottom:1px;
}
.step-head:hover .step-edit{color:var(--oak);border-bottom-color:var(--line-2)}
.step-body{padding:2px 0 34px 38px}
@media (max-width:560px){
  .step-body{padding-left:0}
  .step-answer{max-width:100%;text-align:left;flex-basis:100%}
  .step-head{flex-wrap:wrap;row-gap:4px}
}
.step-help{margin:0 0 22px;max-width:46ch}

/* ---------- option cards ---------- */
.options{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.options.stack{grid-template-columns:minmax(0,1fr);max-width:520px}
.opt{
  border:1px solid var(--line);background:var(--card);
  padding:16px 18px;text-align:left;border-radius:var(--radius);
  transition:border-color .15s ease, background-color .15s ease, transform .15s ease;
  display:flex;flex-direction:column;gap:3px;min-height:64px;justify-content:center;
}
.opt:hover{border-color:var(--line-2);transform:translateY(-1px)}
.opt .label{font-size:16px;letter-spacing:-0.015em}
.opt .sub{font-size:13px;color:var(--muted);line-height:1.45}
.opt[aria-pressed="true"]{
  border-color:var(--oak);background:var(--oak-wash);
}
.opt[aria-pressed="true"] .label{color:var(--oak-ink)}
.opt.quiet{background:transparent;border-style:dashed}
.opt.quiet .label{color:var(--muted);font-size:15px}
.opt.quiet:hover{border-color:var(--oak);}
.opt.quiet:hover .label{color:var(--oak-ink)}
.opt .tag{
  font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted-2);margin-top:2px;
}
.opt[aria-pressed="true"] .tag{color:var(--oak)}
/* A combination Leon don't build — visibly out, and the panel below says why */
.opt:disabled{opacity:.42;cursor:default}
.opt:disabled:hover{border-color:var(--line);transform:none}

/* ---------- size step ---------- */
.size-entry{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:8px}
.field{display:flex;flex-direction:column;gap:8px}
.field label{font-size:10.5px;letter-spacing:.19em;text-transform:uppercase;color:var(--muted-2)}
.diag-wrap{position:relative;display:inline-flex;align-items:center}
.diag{
  width:132px;border:1px solid var(--line-2);background:var(--card);
  padding:13px 40px 13px 16px;font-size:22px;font-weight:300;letter-spacing:-0.02em;
  border-radius:var(--radius);
}
.diag:focus{outline:none;border-color:var(--oak);box-shadow:0 0 0 3px var(--oak-wash)}
.diag-unit{position:absolute;right:16px;font-size:18px;color:var(--muted-2);pointer-events:none}
.txt{
  border:1px solid var(--line-2);background:var(--card);
  padding:13px 16px;font-size:17px;font-weight:300;letter-spacing:-0.005em;
  border-radius:var(--radius);width:100%;max-width:300px;
}
.txt.wide{max-width:380px}
.txt:focus{outline:none;border-color:var(--oak);box-shadow:0 0 0 3px var(--oak-wash)}
.txt::placeholder{color:var(--muted-2);font-weight:300}
.field .note{margin-top:-2px}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:16px}
.chip{
  border:1px solid var(--line);background:var(--card);padding:8px 15px;
  font-size:14px;border-radius:100px;color:var(--ink-80);
  transition:border-color .15s ease,background-color .15s ease;
}
.chip:hover{border-color:var(--line-2)}
.chip[aria-pressed="true"]{border-color:var(--oak);background:var(--oak-wash);color:var(--oak-ink)}
/* A value the product settles for itself. Reads as a statement of fact and
   must never look pressable — that is the whole point of it. */
.given{margin-top:12px;font-size:15px;color:var(--ink-80)}
.given .why{color:var(--muted-2);font-size:13.5px}
.band-readout{
  margin-top:22px;padding:16px 18px;background:var(--paper-2);border-radius:var(--radius);
  max-width:520px;
}
.band-readout .sku{font-size:15px;letter-spacing:.02em}
.band-readout .money{font-size:15px;color:var(--muted)}

/* ---------- swatches ---------- */
.swatches{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:12px;max-width:620px}
.swatch{text-align:left;border:none;padding:0;display:flex;flex-direction:column;gap:9px}
.swatch .chipcolour{
  aspect-ratio:5/4;border-radius:var(--radius);position:relative;
  border:1px solid rgba(26,26,26,.13);
  box-shadow:inset 0 0 0 0 var(--paper);
  transition:box-shadow .16s ease, transform .16s ease;
  /* A photo, when one is supplied, fills the tile and crops rather than
     squashing. The flat hex sits underneath as the fallback. */
  background-size:cover;background-position:center;background-repeat:no-repeat;
}
.swatch:hover .chipcolour{transform:translateY(-2px)}
.swatch[aria-pressed="true"] .chipcolour{
  box-shadow:0 0 0 2px var(--paper), 0 0 0 3px var(--oak);
}
.swatch .name{font-size:13.5px;color:var(--muted)}
.swatch[aria-pressed="true"] .name{color:var(--oak-ink)}

/* ---------- add-ons ---------- */
.addon{
  display:flex;align-items:flex-start;gap:14px;border:1px solid var(--line);
  background:var(--card);padding:16px 18px;border-radius:var(--radius);max-width:560px;
  text-align:left;width:100%;
}
.addon[aria-pressed="true"]{border-color:var(--oak);background:var(--oak-wash)}
.box{
  width:17px;height:17px;border:1px solid var(--line-2);margin-top:3px;flex:none;
  border-radius:1px;position:relative;background:var(--card);
}
.addon[aria-pressed="true"] .box{border-color:var(--oak);background:var(--oak)}
.addon[aria-pressed="true"] .box::after{
  content:"";position:absolute;left:5px;top:1px;width:5px;height:10px;
  border:solid #fff;border-width:0 1.5px 1.5px 0;transform:rotate(43deg);
}
/* Both are spans, so they need display:block or the sub runs on from the label
   as one paragraph and the margin-top below is silently ignored. Affects every
   add-on on every product, not just Tc Fit's. */
.addon .label{font-size:15.5px;display:block}
.addon .sub{font-size:13px;color:var(--muted);margin-top:2px;display:block;line-height:1.45}
.addon .price{margin-left:auto;font-size:15px;color:var(--muted);white-space:nowrap;padding-left:12px}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:9px;
  padding:14px 26px;border-radius:var(--radius);font-size:14.5px;letter-spacing:.01em;
  border:1px solid var(--ink);background:var(--ink);color:var(--paper);
  transition:opacity .15s ease,background-color .15s ease;
}
.btn:hover{opacity:.86}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line-2)}
.btn.ghost:hover{border-color:var(--ink);opacity:1}
.btn.oak{background:var(--oak);border-color:var(--oak);color:#fff}
.btn.sm{padding:10px 18px;font-size:13.5px}
.btn:disabled{opacity:.32;cursor:not-allowed}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px}

/* ---------- panels: block / contact ---------- */
.panel{
  border:1px solid var(--line-2);background:var(--card);
  padding:clamp(22px,2.4vw,34px);border-radius:var(--radius);max-width:620px;margin-top:8px;
}
.panel.block{border-color:var(--line-2);background:var(--paper-2)}
.panel.contact{border-color:var(--oak);background:var(--oak-wash)}
/* Addresses are shown as plain text everywhere in this tool, never as mailto:
   links or buttons that open a draft. A mail-handler link does nothing at all
   for a dealer on webmail — it fails silently, which is what broke the old
   "Send this to CAVD" button. An address you can read, select and copy always
   works. `user-select:all` makes one click select the whole thing. */
.addr{color:var(--oak-ink);letter-spacing:.01em;white-space:nowrap;user-select:all}
.addrs{display:flex;flex-wrap:wrap;gap:6px 22px;margin-top:16px;font-size:15.5px}
.foot-in .addr{color:var(--ink)}
/* The route panel's CTA is now a line of copy rather than a button label —
   the working action beneath it is "Copy the details". */
.panel .cta-line{margin-top:22px;font-size:16px;color:var(--ink);font-weight:500;max-width:46ch}
.panel h3{font-size:clamp(1.25rem,1.05rem + .7vw,1.6rem);margin-bottom:12px}
.panel p{color:var(--ink-80);font-size:15.5px;line-height:1.6;max-width:46ch}
.panel .recap{
  margin-top:22px;padding-top:18px;border-top:1px solid var(--line-2);
  display:grid;gap:7px;
}
.recap-row{display:flex;justify-content:space-between;gap:18px;font-size:14px}
.recap-row dt{color:var(--muted)}
.recap-row dd{margin:0;text-align:right}

/* ---------- price rail ---------- */
.rail{position:sticky;top:28px}
.rail-card{
  border:1px solid var(--line);background:var(--card);border-radius:var(--radius);
  padding:24px 22px;
}
.rail-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:20px}
.rail .big{
  font-size:clamp(2rem,1.6rem + 1.4vw,2.7rem);font-weight:300;letter-spacing:-0.035em;
  line-height:1;
}
.rail .big.placeholder{color:var(--muted-2)}
.rail .undernote{font-size:12.5px;color:var(--muted-2);margin-top:7px;letter-spacing:.01em}
.lines{margin:22px 0 0;padding:20px 0 0;border-top:1px solid var(--line);display:grid;gap:9px}
.line{display:flex;justify-content:space-between;gap:14px;font-size:13.5px}
.line .l{color:var(--muted);max-width:70%}
.line .v{white-space:nowrap}
.line.total{
  border-top:1px solid var(--line);margin-top:6px;padding-top:13px;font-size:15px;
}
.line.total .l{color:var(--ink)}
.rail-meta{margin-top:20px;padding-top:18px;border-top:1px solid var(--line);display:grid;gap:12px}
.metaitem{display:flex;gap:9px;font-size:12.5px;line-height:1.5;color:var(--muted)}
.metaitem .dot{
  width:5px;height:5px;border-radius:50%;background:var(--line-2);margin-top:7px;flex:none;
}
.metaitem.flag .dot{background:var(--warn)}
.metaitem.good .dot{background:var(--oak)}

/* mobile rail */
@media (max-width:900px){
  .rail{
    position:fixed;left:0;right:0;bottom:0;top:auto;z-index:40;
    border-top:1px solid var(--line-2);background:var(--card);
    box-shadow:0 -8px 28px rgba(26,26,26,.07);
    padding-bottom:env(safe-area-inset-bottom);
  }
  .rail-card{border:none;padding:14px var(--gap) 16px;border-radius:0}
  .rail-head{margin-bottom:0;align-items:center}
  .rail .big{font-size:1.75rem}
  .rail .undernote{margin-top:2px}
  .rail-collapse{display:block}
  .rail-body{display:none}
  .rail.is-open .rail-body{display:block}
  .rail.is-open{max-height:78vh;overflow-y:auto}
}
.rail-collapse{display:none;font-size:10.5px;letter-spacing:.19em;text-transform:uppercase;color:var(--muted-2)}

/* ---------- basket ---------- */
.basket{margin-top:clamp(48px,5vw,80px);border-top:1px solid var(--ink);padding-top:26px}
.basket h2{font-size:clamp(1.4rem,1.15rem + .9vw,1.9rem);margin-bottom:6px}
.bitem{
  display:flex;gap:18px;align-items:flex-start;
  padding:20px 0;border-bottom:1px solid var(--line);
}
.bitem .idx{font-size:10.5px;letter-spacing:.19em;color:var(--muted-2);padding-top:5px;min-width:22px}
.bitem .main{flex:1;min-width:0}
.bitem .sku{font-size:16px;letter-spacing:.01em}
.bitem .desc{font-size:13.5px;color:var(--muted);margin-top:4px;line-height:1.5}
.bitem .money{text-align:right;white-space:nowrap;font-size:16px}
.bitem .money .unit{display:block;font-size:12.5px;color:var(--muted-2);margin-top:3px}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:var(--radius);margin-top:10px}
.qty button{width:30px;height:30px;font-size:15px;color:var(--muted);line-height:1}
.qty button:hover{color:var(--ink)}
.qty span{min-width:30px;text-align:center;font-size:14px}
.bitem .acts{display:flex;gap:14px;margin-top:10px}
.linkbtn{
  font-size:10.5px;letter-spacing:.19em;text-transform:uppercase;color:var(--muted-2);
  border-bottom:1px solid transparent;
}
.linkbtn:hover{color:var(--oak-ink);border-bottom-color:var(--line-2)}
.btotals{display:grid;gap:9px;margin-top:24px;max-width:420px;margin-left:auto}
.btotals .line{font-size:14.5px}
.btotals .line.grand{font-size:19px;border-top:1px solid var(--ink);padding-top:14px;margin-top:6px}
.btotals .line.grand .l{color:var(--ink)}

/* ---------- output ---------- */
.output{margin-top:clamp(40px,4vw,64px)}
.sheet{
  border:1px solid var(--line);background:var(--card);padding:clamp(24px,3vw,44px);
  border-radius:var(--radius);
}
.sheet h3{font-size:1.4rem;margin-bottom:4px}
.sheet .sheethead{
  display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap;
  padding-bottom:22px;border-bottom:1px solid var(--line);margin-bottom:24px;
}
.sheet table{width:100%;border-collapse:collapse;font-size:14.5px}
.sheet th{
  text-align:left;font-size:10.5px;letter-spacing:.19em;text-transform:uppercase;
  color:var(--muted-2);font-weight:500;padding:0 0 10px;border-bottom:1px solid var(--line);
}
.sheet th.r,.sheet td.r{text-align:right}
.sheet td{padding:13px 0;border-bottom:1px solid var(--line);vertical-align:top}
.sheet tr.sub td{padding:6px 0 6px 18px;border-bottom:none;color:var(--muted);font-size:13.5px}
.sheet tr.sub + tr.sub td{padding-top:0}
.sheet tfoot td{border-bottom:none;padding-top:16px;font-size:16px}
.sheet .terms{margin-top:26px;padding-top:20px;border-top:1px solid var(--line);display:grid;gap:8px}

/* Shipping, said so it cannot be skimmed past. Dealers were reading straight
   over the terms block at the foot of the sheet, so this runs full width
   directly under the title, and again beside the total. Ruled box rather
   than a colour, because the sheet is printed as often as it is read. */
.shipbar{
  margin:22px 0 26px;padding:13px 16px;
  border:1.5px solid var(--ink);border-radius:var(--radius);
  display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;
}
.shipbar .big{font-size:16.5px;font-weight:500;color:var(--ink);letter-spacing:-0.01em}
.shipbar .small{font-size:13.5px;color:var(--muted)}
.sheet tfoot td.shipfoot{
  padding-top:10px;font-size:13.5px;color:var(--ink);font-weight:500;text-align:right;
}
/* The under-75″ second-bracket allowance. Reads as a caution, not a charge —
   it is deliberately not in the total. */
.sheet tfoot td.allow{
  padding-top:10px;font-size:13px;color:var(--muted);text-align:right;font-weight:400;
}
@media (max-width:560px){
  .shipbar{flex-direction:column;gap:4px}
}

/* ---------- footer ---------- */
.foot{
  border-top:1px solid var(--line);margin-top:auto;
}
.foot-in{
  max-width:1200px;margin:0 auto;padding:34px var(--gap) 96px;
  display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap;
}
.foot-in a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--line-2)}
.foot-in a:hover{color:var(--oak-ink);border-bottom-color:var(--oak)}
.foot-in .eyebrow{display:inline-block;margin-bottom:8px}
@media (max-width:900px){.foot-in{padding-bottom:150px}}

/* ---------- toast ---------- */
.toast{
  position:fixed;left:50%;bottom:96px;transform:translate(-50%,14px);
  background:var(--ink);color:var(--paper);padding:12px 22px;border-radius:var(--radius);
  font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s ease,transform .2s ease;z-index:80;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- print ---------- */
@media print{
  @page{margin:16mm}
  body{background:#fff;font-size:11pt}

/* ============================================================================
   2. STATE
   ========================================================================== */

/* Every step the tool knows about. Which of them a product uses — and in what
   order — comes from that product's `steps` list. */
const STEP_TITLES = {
  product:  "Which product?",
  core:     "What goes in the frame?",
  soundbar: "Which soundbar?",
  channels: "How many channels?",
  size:     "Which TV?",
  model:    "Which cabinet?",
  bracket:  "How does it mount?",
  finish:   "Which finish?",
  grille:   "Which grille?",
  extras:   "Anything else?"
};

/* Products in display order, for the product step */
const CATALOGUE = Object.values(LEON.products).sort((a,b) => a.order - b.order);

const blankCfg = () => ({
  product:null,
  core:null,
  soundbar:null,
  channels:null,
  tvBrand:null, tvBrandOther:"", tvModel:"", tvBezel:"", diagonal:null,
  model:null,
  bracket:null,
  finish:null,
  wantPaint:false,
  grille:{ type:null, colour:null }, addOns:[], qty:1
});

const state = {
  dealer:null,
  cfg:blankCfg(),
  basket:[],
  openStep:null,
  editIndex:null,
  showOutput:false
};

/* ============================================================================
   3. PRICING ENGINE — pure functions over LEON + a config
   ========================================================================== */

const M = LEON.meta;

/* The addresses live once, in M.contact.send. This is the line that prints on
   the sheet, so it has to name them outright — the dealer reads it off a PDF
   with no buttons on it. */
const sendTo = M.contact.send.join(" or ");
M.sendNote = `Email this to ${sendTo}.`;

/* The product a config belongs to. Everything downstream resolves through
   this, so a basket can hold lines from more than one product. */
const prodOf = cfg => (cfg && cfg.product) ? LEON.products[cfg.product] || null : null;

/* The product currently being configured — null until the first step is answered */
const curP = () => prodOf(state.cfg);

const money = n => M.currency + Number(n).toLocaleString("en-GB",
  { minimumFractionDigits: n % 1 === 0 ? 0 : 2, maximumFractionDigits:2 });

/* For an individual price-list line only, never a total. A line at £0 is a
   service the dealer asked for that Leon don't charge for — Tc Fit grille
   contouring is the first — and "£0" reads like a pricing error on a sheet a
   dealer forwards. Say it in words instead. */
const lineMoney = n => Number(n) === 0 ? "No charge" : money(n);

const stepsFor = cfg => {
  const P = prodOf(cfg);
  return ["product"].concat(P ? P.steps : []);
};

const bandFor = (cfg, d) => {
  const P = prodOf(cfg);
  const dd = d === undefined ? cfg.diagonal : d;
  if (!P || dd == null) return null;
  return P.sizeBands.find(b => dd >= b.min && dd <= b.max) || null;
};
const barById = (cfg, id) => {
  const P = prodOf(cfg);
  if (!P || !P.soundbars) return null;
  return P.soundbars.find(s => s.id === id) || (id === "other" ? P.otherBrand : null);
};
const modelById = (cfg, id) => {
  const P = prodOf(cfg);
  if (!P || !P.models) return null;
  return P.models.find(m => m.id === id) || null;
};
const channelById = (cfg, id) => {
  const P = prodOf(cfg);
  if (!P || !P.channels) return null;
  return P.channels.find(c => c.id === id) || null;
};
const tierOf = cfg => { const m = modelById(cfg, cfg.model); return m ? m.tier : null; };
/* Edge only: what sits inside the frame */
const coreById = (cfg, id) => {
  const P = prodOf(cfg);
  if (!P || !P.cores) return null;
  return P.cores.find(k => k.id === id) || null;
};
/* An add-on with `only` belongs to particular cores and nothing else. Checked
   in the price as well as in the UI, so changing core can't leave a stale
   charge on a build that can't take it. */
const addOnAvailable = (cfg, a) => !a.only || a.only.includes(cfg.core);

/* Cheapest thing a product can be, for the "From £x" placeholders. Works for
   both price shapes — a band with a base, or a model's channels × band grid. */
function fromPriceOf(P){
  if (!P) return null;
  if (P.cores) return Math.min(...P.cores.map(k => k.price));
  if (P.models){
    const vals = [];
    P.models.forEach(m => Object.values(m.price).forEach(pair =>
      pair.forEach(v => { if (v != null) vals.push(v); })));
    return vals.length ? Math.min(...vals) : null;
  }
  return Math.min(...P.sizeBands.map(b => b.base + (b.adder || 0)));
}

/* The main unit line — the speaker itself. Returns null when the config can't
   name one yet, or when Leon simply don't build that combination. */
function baseLine(cfg, band){
  const P = prodOf(cfg);
  if (!P || !band) return null;

  /* Edge: the frame is the product, and the system price comes from what sits
     inside it. The size band adds rather than selects. */
  if (P.cores){
    const k = coreById(cfg, cfg.core);
    if (!k) return null;
    return { sku:k.sku, label:`${k.sku} — ${k.label}`, dealer:k.price };
  }

  /* Tonecase: one price per size band. */
  if (!P.models){
    return { sku:band.sku, label:`${P.name} — ${band.label}`, dealer:band.base };
  }

  /* Horizon: {model}{channel suffix}{band suffix}, priced off the grid. */
  const m  = modelById(cfg, cfg.model);
  const ch = channelById(cfg, cfg.channels);
  if (!m || !ch) return null;
  const base = m.price[ch.id][band.idx];
  if (base == null) return null;          // e.g. HzSEVEN in LCR below 75″
  return {
    sku: m.sku + ch.suffix + band.suffix,
    label: `${m.name} ${ch.short} — ${band.label}`,
    dealer: base
  };
}

/* Which bracket a mounting position resolves to, given tier and screen size.
   Null means Leon don't list one for this combination — that routes, it never
   silently prices. */
/* How many of this bracket the job takes. Leon add a second mounting point
   from 75″ up; below that one is specified and the sheet says a second may
   still be wanted. A position that is already a pair by SKU — the -2X
   MatchMount, the twin FlushMount — opts out, or we would sell four. */
function bracketQty(cfg, pos){
  if (!pos || pos.noTwin) return 1;
  if (cfg.diagonal == null) return 1;
  if (pos.noTwinFromOs && pos.osFromDiagonal != null &&
      cfg.diagonal >= pos.osFromDiagonal) return 1;
  return cfg.diagonal >= LEON.meta.twinBracketFrom ? 2 : 1;
}

/* Price and unit come from the one catalogue, never from the position. */
const bracketPrice = sku => {
  const b = LEON.bracketCatalogue[sku];
  return b ? b.price : null;
};

function bracketLineFor(cfg, pos){
  if (!pos) return null;
  /* Routed positions are a conversation, not a line on the sheet. */
  if (pos.route) return null;

  /* In the box: it still prints, at no charge, so the sheet records which
     bracket the dealer is getting rather than leaving it unsaid. */
  if (pos.includedSku)
    return { sku:pos.includedSku, qty:1, each:0, dealer:0, included:true,
             label:`${pos.includedSku} — ${pos.short}, included` };

  const d    = cfg.diagonal;
  const isOs = pos.osFromDiagonal != null && d != null && d >= pos.osFromDiagonal;

  let sku;
  if (pos.tierSku){
    const tier = tierOf(cfg);
    if (!tier) return null;
    const entry = pos.tierSku[tier];
    if (!entry) return null;             // Hz33 MatchMount — ask Leon
    /* A tier carries either one SKU or a std/os pair sized like the rest. */
    if (typeof entry === "string") sku = entry;
    else {
      if (d == null) return null;        // can't size it yet
      sku = isOs ? entry.os : entry.std;
    }
    if (!sku) return null;
  } else if (pos.flatSku){
    sku = pos.flatSku;
  } else {
    if (d == null) return null;
    sku = isOs ? pos.sku.os : pos.sku.std;
  }

  const each = bracketPrice(sku);
  if (each == null) return null;         // SKU not in the catalogue — say nothing
  const qty  = bracketQty(cfg, pos);

  return {
    sku, qty, each, dealer: each * qty,
    label: `${sku}${qty > 1 ? ` × ${qty}` : ""} — ${pos.short}`
         + (isOs && pos.osNote ? `, ${pos.osNote}` : "")
         + (qty > 1 ? `, two mounting points` : "")
  };
}

function bracketPosFor(cfg){
  const P = prodOf(cfg);
  if (!P || !P.brackets || !cfg.bracket || cfg.bracket === "none") return null;
  return P.brackets.positions.find(x => x.id === cfg.bracket) || null;
}

function bracketLine(cfg){
  return bracketLineFor(cfg, bracketPosFor(cfg));
}

/* What to tell a dealer under 75″: one bracket is specified, and Leon may
   still want a second on a wide cabinet. Returns what to allow for it.
   `amount: 0` with `unknown: true` is Tc Fit's included bracket — a second
   is a real possibility, but Leon publish no price for one, so the sheet
   raises it without inventing a number. Nothing at all at 75″ and up, where
   the second bracket is already on the list, or where the position is
   already a pair by SKU. */
function bracketAllowanceFor(cfg){
  const pos = bracketPosFor(cfg);
  if (!pos) return null;
  const line = bracketLineFor(cfg, pos);
  if (!line) return null;
  /* An included bracket raises the question at EVERY size, not just below
     75″ — at 85″ Leon would want two mounting points, and Tc Fit's price
     covers one bracket with no published cost for a second. Silence there
     would be the worst answer of the three. */
  if (pos.twinIsQuestion) return { amount:0, unknown:true };
  if (pos.noTwin) return null;
  if (cfg.diagonal == null || cfg.diagonal >= LEON.meta.twinBracketFrom) return null;
  if (line.qty > 1) return null;
  return line.each ? { amount:line.each, unknown:false } : null;
}
const colourById = (cfg, id) => {
  const P = prodOf(cfg);
  if (!P) return null;
  return P.grille.designer.colours.find(c => c.id === id) || null;
};
/* What the designer fabric costs on this config. Flat on most products, but
   TcFIT-U charges more past 90″ where the grille is a bigger, custom-cut
   piece. Read this rather than `designer.price` anywhere it reaches a dealer. */
function designerPrice(cfg){
  const P = prodOf(cfg);
  if (!P) return 0;
  const D = P.grille.designer;
  return (D.oversize && cfg.diagonal != null && cfg.diagonal >= D.oversize.fromDiagonal)
    ? D.oversize.price
    : D.price;
}

const finishById = (cfg, id) => {
  const P = prodOf(cfg);
  if (!P || !P.finish) return null;
  if (id === "custom") return P.finish.custom;
  return P.finish.options.find(f => f.id === id) || null;
};

/* Which contact route, if any, does this config trigger? */
function routeFor(cfg){
  const P = prodOf(cfg);
  if (!P) return null;
  if (P.soundbars){
    if (cfg.soundbar === "other") return P.otherBrand.reason;
    const bar = P.soundbars.find(s => s.id === cfg.soundbar);
    if (bar && bar.route === "contact") return bar.reason;
  }
  if (P.brackets && cfg.bracket && cfg.bracket !== "none"){
    const pos = P.brackets.positions.find(x => x.id === cfg.bracket);
    /* Routed outright — Leon publish no price for this mounting on this
       product (Tc Fit above the TV). */
    if (pos && pos.route === "contact") return pos.reason;
    /* A position with no bracket for this tier is a question, not a price */
    if (pos && pos.tierSku && tierOf(cfg) && !pos.tierSku[tierOf(cfg)]) return pos.reason;
  }
  /* Custom finish routes on Tonecase (Leon price it per job) but prices on
     Edge (Leon list it at £345). `reason` is what separates the two. */
  if (P.finish && cfg.finish === "custom" && P.finish.custom.reason) return P.finish.custom.reason;
  if (P.paint && cfg.wantPaint) return P.paint.reason;
  if (cfg.diagonal != null && cfg.diagonal > P.diagonal.max)
    return P.diagonal.routeId || "oversize";
  return null;
}

/* Is this soundbar blocked at this screen size? */
function blockFor(cfg){
  const bar = barById(cfg, cfg.soundbar);
  if (!bar || !bar.minDiagonal || cfg.diagonal == null) return null;
  if (cfg.diagonal >= bar.minDiagonal) return null;
  return { bar, min:bar.minDiagonal, size:cfg.diagonal };
}

/* Full price breakdown for a config. Returns null until it can be priced. */
function priceConfig(cfg){
  const P = prodOf(cfg);
  if (!P) return null;
  const band = bandFor(cfg);
  if (!band || routeFor(cfg) || blockFor(cfg)) return null;

  const base = baseLine(cfg, band);
  if (!base) return null;                  // combination Leon don't build

  const lines = [base];

  /* Edge's soundbar-integration charge belongs to the core, not the options —
     Leon quote it as EDGE-TV plus the integration, so it prints as two lines. */
  const core = coreById(cfg, cfg.core);
  if (core && core.extra) lines.push({ ...core.extra });

  if (band.adder) lines.push({ sku:"", label:band.adderLabel, dealer:band.adder });

  /* Bracket is a separate line on Horizon; on Tc Fit the UnderMount is in the
     box and prints at no charge, while the AWB wall yoke is a real charge. */
  const br = bracketLine(cfg);
  if (br) lines.push(br);

  /* A finish only reaches the price when Leon charge for it — Edge's custom
     paint or stain. Everything else is included in the base. */
  const fin = finishById(cfg, cfg.finish);
  if (fin && fin.price) lines.push({ sku:"Custom finish", label:fin.label, dealer:fin.price });

  if (cfg.grille.type === "designer" && cfg.grille.colour){
    const c = colourById(cfg, cfg.grille.colour);
    lines.push({ sku:"Designer grille", label:`Designer grille fabric — ${c.name}`, dealer:designerPrice(cfg) });
  }
  cfg.addOns.forEach(id => {
    const a = P.addOns.find(x => x.id === id);
    if (a && addOnAvailable(cfg, a)) lines.push({ sku:a.sku, label:a.label, dealer:a.price });
  });

  const dealer = lines.reduce((t,l) => t + l.dealer, 0);
  return {
    band, lines, dealer,
    /* The headline SKU for this line — the speaker, not the bracket */
    sku: base.sku,
    productId: P.id,
    productName: P.name,
    confirm: band.confirm || null,
    /* Money the dealer should keep back for a second bracket Leon may ask
       for. Never added to `dealer` — it is an allowance, not a charge. */
    bracketAllowance: bracketAllowanceFor(cfg)
  };
}

/* ---- the TV: brand + model + diagonal ---- */

/* Where one manufacturer makes the only set the product fits, the brand is not
   a decision — FrameBar is built for the Samsung Frame and nothing else. The
   answer is settled here rather than asked for, and everything below treats it
   as already given, so a dealer is never stopped by a question with one answer.
   Fixed only when there is a single brand AND no "another brand" escape hatch. */
function fixedBrand(P){
  const T = P && P.tv;
  return (T && !T.otherLabel && T.brands && T.brands.length === 1) ? T.brands[0] : null;
}
function tvComplete(c){
  if (!c.tvBrand && !fixedBrand(prodOf(c))) return false;
  if (c.tvBrand === "__other" && !(c.tvBrandOther || "").trim()) return false;
  return !!(c.tvModel || "").trim();
}
function tvBrandName(c){
  if (c.tvBrand === "__other") return (c.tvBrandOther || "").trim();
  /* Falls back to the fixed brand so it still prints on the sheet even if
     state never carried it — a basket item saved before this existed, say. */
  return c.tvBrand || fixedBrand(prodOf(c)) || "";
}
function tvLabel(c){
  return [tvBrandName(c), (c.tvModel || "").trim()].filter(Boolean).join(" ");
}
/* FrameBar's bezel, for anywhere the config is written out. It prints whether
   or not it was filled in: Leon match the FrameBar finish to this, so a blank
   one is an open question that has to be visible on the sheet, not an
   omission that reads as "nothing to say". Empty string on every other
   product, which have no bezel to match. */
function bezelLabel(cfg){
  const T = (prodOf(cfg) || {}).tv;
  if (!T || !T.bezelLabel) return "";
  const v = (cfg.tvBezel || "").trim();
  return v ? `bezel ${v}` : T.bezelMissing;
}

/* Human description of a config, for summaries and the price list */
function describe(cfg){
  const P = prodOf(cfg);
  if (!P) return "";
  const bar = barById(cfg, cfg.soundbar);
  const bits = [];
  if (bar) bits.push(bar.label);
  const core = coreById(cfg, cfg.core);
  /* Say outright whether the speaker is in the price — this line prints on the
     sheet a dealer forwards, and "Edge with Hz44UX" reads as included either
     way unless we spell it out. */
  if (core) bits.push(core.label + (core.includes ? "" : " (supplied separately)"));
  const ch = channelById(cfg, cfg.channels);
  if (ch) bits.push(ch.label.toLowerCase());
  const tv = tvLabel(cfg);
  if (tv) bits.push(tv + (cfg.diagonal != null ? " · " + cfg.diagonal + "″" : ""));
  else if (cfg.diagonal != null) bits.push(cfg.diagonal + "″ TV");
  const bez = bezelLabel(cfg);
  if (bez) bits.push(bez);
  /* The bracket prints on the sheet a dealer forwards to Leon, so it carries
     the count as well as the SKU — "HzUMB — below the TV" and "HzUMB × 2 —
     below the TV" are different orders. */
  if (P.brackets && cfg.bracket){
    if (cfg.bracket === "none") bits.push("no bracket");
    else {
      const br  = bracketLine(cfg);
      const pos = P.brackets.positions.find(x => x.id === cfg.bracket);
      if (br) bits.push(`${br.sku}${br.qty > 1 ? ` × ${br.qty}` : ""} — ${pos.short}`
                      + (br.included ? ", included" : ""));
      /* Something Leon must know at order rather than discover on the bench.
         It prints here because this line is what the dealer forwards. */
      if (pos && pos.orderNote) bits.push(pos.orderNote);
    }
  }
  /* Products where Leon put the bracket in the box and there is no step to
     answer — it still belongs on the sheet, or the dealer can't tell whether
     mounting was considered at all. */
  if (P.bracketIncluded) bits.push(P.bracketIncluded);
  if (P.finish && cfg.finish){
    const f = finishById(cfg, cfg.finish);
    if (f) bits.push((f.name || f.label) + " finish");
  }
  if (cfg.grille.type === "standard") bits.push("standard black grille");
  if (cfg.grille.type === "designer" && cfg.grille.colour)
    bits.push("designer grille — " + colourById(cfg, cfg.grille.colour).name);
  cfg.addOns.forEach(id => {
    const a = P.addOns.find(x => x.id === id);
    if (a && addOnAvailable(cfg, a)) bits.push(a.label);
  });
  /* An add-on carrying `offLabel` is one where NOT having it has to be said out
     loud — a free service left unticked reads exactly like a free service
     nobody thought about. Only Tc Fit contouring sets it. */
  P.addOns.forEach(a => {
    if (a.offLabel && addOnAvailable(cfg, a) && !cfg.addOns.includes(a.id))
      bits.push(a.offLabel);
  });
  return bits.join(" · ");
}

/* Basket maths, including the system-discount check */
function basketTotals(){
  const dealer = state.basket.reduce((t,i) => t + i.price.dealer * i.qty, 0);
  return {
    dealer,
    /* Which products are on the list — drives the output sheet heading */
    productNames: [...new Set(state.basket.map(i => i.price.productName))],
    /* Second-bracket allowance across the whole list. `amount` is money to
       keep back and is deliberately NOT in `dealer`; `unknown` means at least
       one line raises the question without a price Leon have published. */
    bracketAllowance: state.basket.reduce((acc, i) => {
      const a = i.price.bracketAllowance;
      if (!a) return acc;
      return { amount: acc.amount + a.amount * i.qty,
               unknown: acc.unknown || a.unknown };
    }, { amount:0, unknown:false }),
    /* Neither Tonecase alone makes a 5.1 Leon system, so the discount never
       auto-applies. Encoded here so Phase 3 only has to set this. */
    systemDiscountApplies:false
  };
}

/* ============================================================================
   4. STEP STATE
   ========================================================================== */

function answered(id){
  const c = state.cfg;
  switch(id){
    case "product":  return c.product !== null;
    case "core":     return c.core !== null;
    case "soundbar": return c.soundbar !== null;
    case "channels": return c.channels !== null;
    case "size":     return tvComplete(c) && c.diagonal !== null && !blockFor(c);
    case "model":    return c.model !== null && !!baseLine(c, bandFor(c));
    case "bracket":  return c.bracket !== null;
    case "finish":   return c.finish !== null;
    case "grille":   return c.grille.type === "standard" ||
                            (c.grille.type === "designer" && !!c.grille.colour);
    case "extras":   return false;   // terminal step, never collapses
    default: return false;
  }
}

/* Which step sent this config to the contact panel? -1 if none. */
function routedStepIndex(){
  const c = state.cfg;
  const P = curP();
  if (!P) return -1;
  const steps = stepsFor(c);
  const at = id => steps.indexOf(id);

  if (P.soundbars){
    if (c.soundbar === "other") return at("soundbar");
    const bar = P.soundbars.find(s => s.id === c.soundbar);
    if (bar && bar.route === "contact") return at("soundbar");
  }
  if (c.diagonal != null && c.diagonal > P.diagonal.max) return at("size");
  if (P.brackets && c.bracket && c.bracket !== "none"){
    const pos = P.brackets.positions.find(x => x.id === c.bracket);
    /* Two ways a bracket becomes a conversation: the position is routed
       outright (Tc Fit above the TV), or Leon list no SKU for this tier
       (Hz33 on either MatchMount). */
    if (pos && pos.route === "contact") return at("bracket");
    if (pos && pos.tierSku && tierOf(c) && !pos.tierSku[tierOf(c)]) return at("bracket");
  }
  if (P.finish && c.finish === "custom" && P.finish.custom.reason) return at("finish");
  if (P.paint && c.wantPaint) return at("extras");
  return -1;
}

/* Flow stops at a contact route — nothing after it is a real decision. The
   routing step stays open so a different answer is one click, not a hunt. */
function activeStepId(){
  const steps = stepsFor(state.cfg);
  if (state.openStep && steps.includes(state.openStep)) return state.openStep;
  const ri = routedStepIndex();
  if (ri >= 0) return steps[ri];
  for (const id of steps){
    if (!answered(id)) return id;
  }
  return steps[steps.length - 1];
}

function stepVisible(id){
  const steps = stepsFor(state.cfg);
  const i  = steps.indexOf(id);
  if (i === -1) return false;
  const ri = routedStepIndex();
  if (ri >= 0) return i <= ri;          // hide everything past the routing step
  const ai = steps.indexOf(activeStepId());
  return i <= ai;
}

function summaryFor(id){
  const c = state.cfg;
  const P = curP();
  switch(id){
    case "product":  return P ? P.name : "";
    case "core":     { const k = coreById(c, c.core);
                       return k ? `${k.label} · ${k.sku}` : ""; }
    case "soundbar": return (barById(c, c.soundbar) || {}).label || "";
    case "channels": return (channelById(c, c.channels) || {}).label || "";
    case "size":     { const b = bandFor(c);
                       const bl = baseLine(c, b);
                       return [tvLabel(c), c.diagonal + "″",
                               bl ? bl.sku : (b ? b.label : "")].filter(Boolean).join(" · "); }
    case "model":    { const bl = baseLine(c, bandFor(c));
                       const m  = modelById(c, c.model);
                       return bl ? bl.sku : (m ? m.name : ""); }
    case "bracket":  { if (!P || !P.brackets) return "";
                       if (c.bracket === "none")
                         return P.brackets.none ? P.brackets.none.label : "";
                       const br  = bracketLine(c);
                       const pos = P.brackets.positions.find(x => x.id === c.bracket);
                       if (!pos) return "";
                       return br
                         ? `${pos.label} · ${br.sku}${br.qty > 1 ? ` × ${br.qty}` : ""}`
                         : pos.label; }
    case "finish":   { const f = finishById(c, c.finish); return f ? (f.name || f.label) : ""; }
    case "grille":   return c.grille.type === "designer"
                        ? "Designer — " + (colourById(c, c.grille.colour) || {}).name
                        : "Standard Black";
    default: return "";
  }
}

/* ============================================================================
   5. RENDER
   ========================================================================== */

const $ = sel => document.querySelector(sel);
const esc = s => String(s).replace(/[&<>"']/g, m =>
  ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[m]));

/* One swatch tile's background. A photo from SWATCH_PHOTOS if we have one,
   layered over the flat hex so the tile is never empty while an image decodes
   — and so the whole thing still reads correctly if no photos are embedded. */
function swatchStyle(kind, id, hex){
  const photo = SWATCH_PHOTOS[`${kind}-${id}`];
  return photo ? `background-color:${hex};background-image:url('${photo}')`
               : `background-color:${hex}`;
}
/* "Swatches are indicative" is the right caveat for flat colour chips. Once
   real photographs are in, the honest note changes — the texture is true, but
   screens and room lighting still aren't. Falls back to whatever the product
   data says while no photos are embedded. */
function swatchNote(kind, fallback){
  const hasPhotos = Object.keys(SWATCH_PHOTOS).some(k => k.startsWith(kind + "-"));
  return hasPhotos
    ? "Photographed samples. Colour still shifts with the screen you're on and the light in the room — ask us for physical swatches before you commit a client."
    : fallback;
}

function render(){
  renderSteps();
  renderRail();
  renderBasket();
  renderOutput();
}

/* ---------- steps ---------- */
function renderSteps(){
  const active = activeStepId();
  const route  = routeFor(state.cfg);
  const steps  = stepsFor(state.cfg);
  let html = "";

  steps.forEach((id, i) => {
    if (!stepVisible(id)) return;
    const isOpen = id === active;
    const isDone = answered(id) && !isOpen;
    html += `<section class="step ${isOpen ? "is-open" : ""}" data-step="${id}">`;

    if (isDone){
      html += `<button class="step-head" data-open="${id}">
          <span class="step-num">${String(i+1).padStart(2,"0")}</span>
          <span class="step-title">${esc(STEP_TITLES[id])}</span>
          <span class="step-answer">${esc(summaryFor(id))}</span>
          <span class="step-edit">Change</span>
        </button>`;
    } else {
      html += `<div class="step-head">
          <span class="step-num">${String(i+1).padStart(2,"0")}</span>
          <span class="step-title">${esc(STEP_TITLES[id])}</span>
        </div>`;
      if (isOpen) html += `<div class="step-body">${stepBody(id)}</div>`;
    }
    html += `</section>`;
  });

  if (route) html += contactPanel(route);

  $("#steps").innerHTML = html;
  wireSteps();
}

function stepBody(id){
  switch(id){
    case "product":  return bodyProduct();
    case "core":     return bodyCore();
    case "soundbar": return bodySoundbar();
    case "channels": return bodyChannels();
    case "size":     return bodySize();
    case "model":    return bodyModel();
    case "bracket":  return bodyBracket();
    case "finish":   return bodyFinish();
    case "grille":   return bodyGrille();
    case "extras":   return bodyExtras();
  }
  return "";
}

function bodyProduct(){
  const c = state.cfg;
  let h = `<p class="note step-help">${esc(LEON.family.intro)}</p>`;
  /* Two families now, so the list groups rather than running flat */
  const families = [...new Set(CATALOGUE.map(p => p.family))];
  families.forEach((fam, i) => {
    h += `<div class="eyebrow" style="margin-top:${i ? 26 : 4}px;margin-bottom:12px">${esc(fam)}</div>
      <div class="options stack">`;
    CATALOGUE.filter(p => p.family === fam).forEach(p => {
      h += `<button class="opt" data-pick="product" data-val="${p.id}" aria-pressed="${c.product === p.id}">
          <span class="label">${esc(p.name)}</span>
          <span class="sub">${esc(p.pickLine)}</span>
          <span class="tag">From ${money(fromPriceOf(p))}</span>
        </button>`;
    });
    h += `</div>`;
  });
  return h;
}

/* Edge's first decision. Grouped, because "does this price include a speaker?"
   is the thing a dealer most needs to read off the page — the groups answer it
   once each rather than every card repeating it. */
function bodyCore(){
  const c = state.cfg;
  const P = curP();
  const band = bandFor(c);
  let h = `<p class="note step-help">${esc(P.coreHelp)}</p>`;

  P.coreGroups.forEach((g, i) => {
    h += `<div class="eyebrow" style="margin-top:${i ? 26 : 4}px;margin-bottom:4px">${esc(g.name)}</div>
      <p class="note" style="margin-bottom:12px">${esc(g.blurb)}</p>
      <div class="options stack">`;
    P.cores.filter(k => k.group === g.id).forEach(k => {
      /* The card shows what this core costs all-in, so the ladder compares
         like with like — including the integration charge where there is one,
         and the oversize adder once the screen size is known. */
      const total = k.price + (k.extra ? k.extra.dealer : 0) + (band ? band.adder : 0);
      h += `<button class="opt" data-pick="core" data-val="${k.id}" aria-pressed="${c.core === k.id}">
          <span class="label">${esc(k.label)}</span>
          <span class="sub">${esc(k.sku)} · ${esc(k.sub)}</span>
          <span class="tag">${esc(money(total))}</span>
        </button>`;
    });
    h += `</div>`;
  });
  return h;
}

function bodyChannels(){
  const c = state.cfg;
  const P = curP();
  let h = `<p class="note step-help">${esc(P.intro)}</p><div class="options stack">`;
  P.channels.forEach(ch => {
    h += `<button class="opt" data-pick="channels" data-val="${ch.id}" aria-pressed="${c.channels === ch.id}">
        <span class="label">${esc(ch.label)}</span>

}

function bodyModel(){
  const c    = state.cfg;
  const P    = curP();
  const band = bandFor(c);
  const ch   = channelById(c, c.channels);
  let h = `<p class="note step-help">${esc(P.modelHelp)}</p>`;
  let gap = null;                     // a cabinet Leon don't build at this size

  P.tiers.forEach(t => {
    h += `<div class="eyebrow" style="margin-top:22px;margin-bottom:4px">${esc(t.name)}</div>
      <p class="note" style="margin-bottom:12px">${esc(t.blurb)}</p>
      <div class="options stack">`;
    P.models.filter(m => m.tier === t.id).forEach(m => {
      const val     = (ch && band) ? m.price[ch.id][band.idx] : null;
      const missing = !!(ch && band) && val == null;
      if (missing) gap = m;
      const tag = missing ? "Not at this size"
                : (val != null ? money(val + (band.adder || 0)) : "");
      h += `<button class="opt" data-pick="model" data-val="${m.id}"
              ${missing ? "disabled" : ""} aria-pressed="${c.model === m.id}">
          <span class="label">${esc(m.name)}</span>
          <span class="sub">${esc(m.sub)}</span>
          ${tag ? `<span class="tag">${esc(tag)}</span>` : ""}
        </button>`;
    });
    h += `</div>`;
  });

  /* Don't just grey it out — say why, and offer the two ways round it. */
  if (gap && ch){
    const alt = P.models.find(x => x.id === P.gapAlternative);
    h += `<div class="panel block" style="margin-top:26px">
        <h3>${esc(gap.name)} in ${esc(ch.short)} starts at 75″.</h3>
        <p>Leon don't build that one below the oversize range. On a ${c.diagonal}″ we'd put the ${esc(alt.name)} in front of you — same tier — or run the ${esc(gap.name)} as left and right.</p>
        <div class="btnrow">
          <button class="btn sm" data-pick="model" data-val="${alt.id}">Use the ${esc(alt.name)}</button>
          <button class="btn ghost sm" data-pick="channels" data-val="lr">Switch to left and right</button>
        </div>
      </div>`;
  }
  return h;
}

function bodyBracket(){
  const c = state.cfg;
  const P = curP();
  const B = P.brackets;
  let h = `<p class="note step-help">${esc(B.help)}</p>`;
  /* Which way the speaker behaves when the screen moves is the decision a
     dealer on a swing arm is actually making, so it is said once up front
     rather than left to be inferred from four sub-lines. */
  if (B.movementHelp)
    h += `<p class="note step-help">${esc(B.movementHelp)}</p>`;
  h += `<div class="options stack">`;

  B.positions.forEach(pos => {
    const line = bracketLineFor(c, pos);
    /* Three states an option can be in: routed by Leon's own silence, listed
       with no SKU for this tier, or a real priced (or included) line. */
    const unknown = !pos.route && !!pos.tierSku && !line;
    let tag = "";
    if (pos.route)          tag = "Ask us";
    else if (unknown)       tag = "Ask us";
    else if (line && line.included) tag = pos.includedTag || "Included";
    else if (line)          tag = "+" + money(line.dealer);

    const sub = line ? `${line.sku}${line.qty > 1 ? ` × ${line.qty}` : ""} · ${pos.sub}`
                     : pos.sub;
    h += `<button class="opt" data-pick="bracket" data-val="${pos.id}" aria-pressed="${c.bracket === pos.id}">
        <span class="label">${esc(pos.label)}</span>
        <span class="sub">${esc(sub)}</span>
        ${tag ? `<span class="tag">${esc(tag)}</span>` : ""}
      </button>`;
  });
  h += `</div>`;

  /* Say why the count doubled before a dealer wonders whether it's a bug. */
  const chosen = bracketPosFor(c);
  const chosenLine = bracketLine(c);
  if (chosenLine && chosenLine.qty > 1)
    h += `<p class="note" style="margin-top:14px;max-width:52ch">${esc(LEON.meta.twinBracketWhy)}</p>`;
  else if (chosen && bracketAllowanceFor(c))
    h += `<p class="note" style="margin-top:14px;max-width:52ch">${esc(LEON.meta.bracketAllowanceNote)}</p>`;

  if (B.none)
    h += `<div class="options stack" style="margin-top:10px">
        <button class="opt quiet" data-pick="bracket" data-val="none" aria-pressed="${c.bracket === "none"}">
          <span class="label">${esc(B.none.label)}</span>
          <span class="sub">${esc(B.none.sub)}</span>
        </button>
      </div>`;
  return h;
}

function bodySoundbar(){

function bodySize(){
  const c = state.cfg;
  const P = curP();
  const T = P.tv;
  const block = blockFor(c);
  const band  = bandFor(c);
  /* Shortcuts only — the dealer can type any size. 48, 77 and 83 are here
     because they're OLED panel sizes and the LCD ladder skips them; a dealer
     specifying an OLED job shouldn't have to reach for the keyboard. Shared
     across every product, so keep it to sizes that are real somewhere. */
  const common = [43,48,50,55,65,75,77,83,85,98];

  let h = `<p class="note step-help">${esc(T.why)}</p>`;

  /* brand */
  h += `<div class="eyebrow">Brand</div>`;
  const fixed = fixedBrand(P);
  if (fixed){
    /* Stated, not offered. A lone chip that has to be pressed before the step
       will complete reads as a label, not a control — dealers filled in the
       model and the size on FrameBar and then found Continue still dead. */
    h += `<div class="given">${esc(fixed)}<span class="why"> · the only brand ${esc(P.name)} is built for</span></div>`;
  } else {
    h += `<div class="chips" style="margin-top:12px">`;
    T.brands.forEach(b => {
      h += `<button class="chip" data-brand="${esc(b)}" aria-pressed="${c.tvBrand === b}">${esc(b)}</button>`;
    });
    /* No escape hatch where only one manufacturer makes the set — offering
       "another brand" would invite an answer the product can't take. */
    if (T.otherLabel)
      h += `<button class="chip" data-brand="__other" aria-pressed="${c.tvBrand === "__other"}">${esc(T.otherLabel)}</button>`;
    h += `</div>`;
  }

  if (c.tvBrand === "__other"){
    h += `<div class="field" style="margin-top:20px">
        <label for="tvbrand">Which brand?</label>
        <input class="txt" id="tvbrand" type="text" autocomplete="off"
               value="${esc(c.tvBrandOther || "")}" placeholder="e.g. Loewe">
      </div>`;
  }

  /* model number */
  h += `<div class="field" style="margin-top:26px">
      <label for="tvmodel">${esc(T.modelLabel || "Model number")}</label>
      <input class="txt wide" id="tvmodel" type="text" autocomplete="off" spellcheck="false"
             value="${esc(c.tvModel || "")}" placeholder="${esc(T.modelPlaceholder || "e.g. QE65QN90DATXXU")}">
      <span class="note">${esc(T.modelHelp)}</span>
    </div>`;

  /* bezel — FrameBar only, because it is the only product Leon finish to
     match a bezel. Its own box, directly under the model it belongs to. */
  if (T.bezelLabel){
    h += `<div class="field" style="margin-top:26px">
        <label for="tvbezel">${esc(T.bezelLabel)}</label>
        <input class="txt wide" id="tvbezel" type="text" autocomplete="off" spellcheck="false"
               value="${esc(c.tvBezel || "")}" placeholder="${esc(T.bezelPlaceholder || "")}">
        <span class="note">${esc(T.bezelHelp)}</span>
      </div>`;
  }

  /* diagonal */
  h += `<div class="field" style="margin-top:26px">
      <label for="diag">Screen diagonal</label>
      <span class="diag-wrap">
        <input class="diag tabular" id="diag" type="number" inputmode="numeric"
               min="${P.diagonal.min}" max="200" step="1"
               value="${c.diagonal != null ? c.diagonal : ""}" placeholder="65">
        <span class="diag-unit">″</span>
      </span>
    </div>
    <div class="chips">`;
  common.forEach(n => {
    h += `<button class="chip tabular" data-size="${n}" aria-pressed="${c.diagonal === n}">${n}″</button>`;
  });
  h += `</div>
    <p class="note" style="margin-top:16px;max-width:46ch">${esc(P.flatPriceNote)}</p>`;

  if (block){
    const B = LEON.blocks.minDiagonal;
    h += `<div class="panel block" style="margin-top:26px">
        <h3>${esc(B.title(block.bar.label, block.size, block.min))}</h3>
        <p>${esc(B.body(block.bar.label, block.size))}</p>
        <div class="btnrow">`;
    B.alternatives.forEach((altId, i) => {
      const alt = barById(c, altId);
      if (!alt) return;
      h += `<button class="btn ${i === 0 ? "" : "ghost"} sm" data-switch="${alt.id}">Switch to ${esc(alt.label)}</button>`;
    });
    h += `<button class="btn ghost sm" data-clearsize="1">Change the screen size</button></div></div>`;
    return h;
  }

  const ro0 = bandReadout(c);
  h += `<div class="band-readout" id="bandReadout" ${ro0 ? "" : "hidden"}>
      <div class="sku">${ro0 ? ro0.sku : ""}</div>
      <div class="money tabular" style="margin-top:4px">${ro0 ? esc(ro0.money) : ""}</div>
      <p class="note confirmnote" style="margin-top:10px">${ro0 ? esc(ro0.note) : ""}</p>
    </div>
    <div class="btnrow">
      <button class="btn" data-next="size" id="sizeNext" ${tvComplete(c) && band ? "" : "disabled"}>Continue</button>
    </div>`;
  return h;
}

/* What the size step can say about price. On Tonecase the band names the SKU
   and the price outright. On Horizon the cabinet is still to come, so the band
   names the build and the price waits for the next step. */
function bandReadout(cfg){
  const band = bandFor(cfg);
  if (!band) return null;
  const bl = baseLine(cfg, band);
  if (bl) return {
    sku:   esc(bl.sku) + ` <span class="note">· ${esc(band.label)}</span>`,
    money: money(bl.dealer + (band.adder || 0)) + " dealer, ex VAT",
    note:  band.confirm || ""
  };
  return {
    sku:   esc(band.label) + ` <span class="note">· ${esc(band.suffix ? band.suffix + " build" : "standard build")}</span>`,
    money: "",
    note:  "Prices show on the next step, once you've picked the cabinet."
  };
}

/* Keeps the TV step live while typing, without re-rendering the inputs */
function refreshSizeStep(){
  const c = state.cfg;
  const band = bandFor(c);
  const ro = document.getElementById("bandReadout");
  const next = document.getElementById("sizeNext");
  if (ro){
    const parts = bandReadout(c);
    ro.hidden = !parts;
    if (parts){
      ro.querySelector(".sku").innerHTML = parts.sku;
      ro.querySelector(".money").textContent = parts.money;
      ro.querySelector(".confirmnote").textContent = parts.note;
    }
  }
  if (next) next.disabled = !(tvComplete(c) && band && !blockFor(c));
  renderRail();
}

function contactPanel(routeId){
  const r = LEON.routes[routeId];
  const c = state.cfg;
  const P = curP();
  const rows = [];
  if (P) rows.push(["Product", P.name]);
  if (c.soundbar) rows.push(["Soundbar", (barById(c, c.soundbar)||{}).shortLabel || (barById(c, c.soundbar)||{}).label]);
  if (c.core){ const k = coreById(c, c.core);
               if (k) rows.push(["In the frame", `${k.label} · ${k.sku}`]); }
  if (c.channels) rows.push(["Channels", (channelById(c, c.channels)||{}).label]);
  if (tvLabel(c)) rows.push(["TV", tvLabel(c)]);
  { const T = (P||{}).tv;
    if (T && T.bezelLabel)
      rows.push(["Bezel", (c.tvBezel||"").trim() || "To confirm"]); }
  if (c.diagonal != null) rows.push(["Screen", c.diagonal + "″"]);
  if (c.model){ const bl = baseLine(c, bandFor(c)); const m = modelById(c, c.model);
                rows.push(["Cabinet", bl ? bl.sku : (m||{}).name]); }
  if (c.bracket && P && P.brackets){
    const br  = bracketLine(c);
    const pos = P.brackets.positions.find(x => x.id === c.bracket);
    rows.push(["Mounting", c.bracket === "none" ? (P.brackets.none||{}).label
             : br ? `${pos.label} · ${br.sku}${br.qty > 1 ? ` × ${br.qty}` : ""}`
                  : `${(pos||{}).label} — bracket to confirm`]);
  }
  if (c.finish){ const f = finishById(c, c.finish); if (f) rows.push(["Finish", f.name || f.label]); }
  if (c.grille.type) rows.push(["Grille", c.grille.type === "designer"
      ? "Designer — " + ((colourById(c, c.grille.colour)||{}).name || "colour TBC")
      : "Standard Black"]);
  if (c.wantPaint) rows.push(["Paint", "Custom colour"]);
  if (state.basket.length) rows.push(["Also on this list", state.basket.length + " configured " + (state.basket.length===1?"item":"items")]);

  return `<div class="panel contact" id="contactPanel">
      <div class="eyebrow" style="margin-bottom:10px">Speak to the team</div>
      <h3>${esc(r.title)}</h3>
      <p>${esc(r.body)}</p>
      <dl class="recap">
        ${rows.map(([k,v]) => `<div class="recap-row"><dt>${esc(k)}</dt><dd>${esc(v)}</dd></div>`).join("")}
      </dl>
      <p class="cta-line">${esc(M.contact.enquiryLine)}</p>
      <div class="addrs">
        ${M.contact.all.map(a => `<span class="addr">${esc(a)}</span>`).join("")}
      </div>
      <div class="btnrow">
        <button class="btn oak" data-copyenq="${routeId}">Copy the details</button>
        <button class="btn ghost" data-restart="1">Start again</button>
      </div>
    </div>`;
}

/* ---------- price rail ---------- */
function renderRail(){
  const c = state.cfg;
  const P = curP();
  const p = priceConfig(c);
  const route = routeFor(c);
  const bandOnly = bandFor(c);
  const priceEl = $("#railPrice"), underEl = $("#railUnder");

  /* Cheapest thing the tool can sell, for the pre-product placeholder */
  const catalogueFrom = Math.min(...CATALOGUE.map(fromPriceOf));
  /* Null on Horizon until the cabinet is picked — the band alone has no price */
  const bandBase = baseLine(c, bandOnly);

  if (route){
    priceEl.textContent = "POA";
    priceEl.classList.add("placeholder");
    underEl.textContent = "We'll price this with you";
  } else if (p){
    priceEl.textContent = money(p.dealer);
    priceEl.classList.remove("placeholder");
    underEl.textContent = "Dealer, ex VAT";
  } else if (bandBase && !blockFor(c)){
    priceEl.textContent = money(bandBase.dealer + bandOnly.adder);
    priceEl.classList.remove("placeholder");
    underEl.textContent = "Dealer, ex VAT · before options";
  } else {
    priceEl.textContent = "From " + money(P ? fromPriceOf(P) : catalogueFrom);
    priceEl.classList.add("placeholder");
    underEl.textContent = "Dealer, ex VAT";
  }

  let h = "";
  /* Preview the price once the band is known, filling in whatever standard
     answers the dealer hasn't reached yet. */
  /* Fill in only the bracket that costs nothing to assume — one Leon put in
     the box. Horizon's are all priced, so presuming one would quietly inflate
     the preview before the dealer has chosen where the speaker sits. */
  const freeBracket = P && P.brackets
    ? (P.brackets.positions.find(x => x.includedSku) || {}).id || null
    : null;
  const shown = p || (bandBase && !route && !blockFor(c)
      ? priceConfig({ ...c,
          bracket: c.bracket || freeBracket,
          finish: c.finish || (P && P.finish ? P.finish.options[0].id : null),
          grille:{ type:c.grille.type || "standard", colour:c.grille.colour } })
      : null);

  if (shown){
    h += `<div class="lines">`;
    shown.lines.forEach(l => {
      h += `<div class="line"><span class="l">${esc(l.label)}</span><span class="v tabular">${lineMoney(l.dealer)}</span></div>`;
    });
    h += `<div class="line total"><span class="l">Dealer, ex VAT</span><span class="v tabular">${money(shown.dealer)}</span></div>
    </div>`;

    h += `<div class="rail-meta">
      ${P.brackets && !c.bracket ? `<div class="metaitem flag"><span class="dot"></span>
        <span>Bracket still to choose — it's priced separately on Horizon.</span></div>` : ""}
      <div class="metaitem"><span class="dot"></span><span>${esc(M.shippingNote)}</span></div>
      <div class="metaitem"><span class="dot"></span><span>${esc(M.leadTimeNote)}</span></div>
      ${shown.confirm ? `<div class="metaitem flag"><span class="dot"></span><span>${esc(shown.confirm)}</span></div>` : ""}
    </div>`;
  } else if (route){
    h += `<div class="rail-meta"><div class="metaitem flag"><span class="dot"></span>
      <span>This one's outside the standard build. Our addresses are in the panel — copy the details across and we'll come back with a price.</span></div></div>`;
  } else if (P){
    h += `<div class="rail-meta"><div class="metaitem"><span class="dot"></span>
      <span>${esc(P.flatPriceNote)}</span></div>
      <div class="metaitem"><span class="dot"></span><span>${esc(P.railNote)}</span></div></div>`;
  } else {
    h += `<div class="rail-meta"><div class="metaitem"><span class="dot"></span>
      <span>${esc(LEON.family.intro)}</span></div></div>`;
  }

  if (state.basket.length){
    const t = basketTotals();
    h += `<div class="rail-meta"><div class="metaitem good"><span class="dot"></span>
      <span>${state.basket.length} ${state.basket.length===1?"line":"lines"} on the list · ${money(t.dealer)} dealer</span></div></div>`;
  }

  $("#railBody").innerHTML = h;
}

        <button class="btn ghost sm" data-copyenq="system">Copy the details</button>

  h += `<div class="btnrow">
      <button class="btn" data-newitem="1">Add another TV</button>
      <button class="btn ghost" data-showoutput="1">${state.showOutput ? "Hide the price list" : "Get the price list"}</button>
      <button class="btn ghost" data-clearbasket="1">Clear</button>

  el.innerHTML = h;
